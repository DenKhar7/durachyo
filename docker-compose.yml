services:
  bot:
    build: .
    container_name: sglypa
    restart: unless-stopped
    env_file: .env
    volumes:
      - sglypa-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sglypa-data:
